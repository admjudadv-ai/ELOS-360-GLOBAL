plugins { id 'com.android.application' }
android {
    namespace 'br.com.elo360global.app'
    compileSdk 34
    defaultConfig {
        applicationId 'br.com.elo360global.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        manifestPlaceholders = [hostName: 'elo360global.com.br', launchUrl: 'https://elo360global.com.br/sistema']
        resValue 'string', 'app_name', 'Elos 360° Global'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
