services:
  - type: web
    name: elo360-auth-staging
    runtime: node
    plan: free
    region: virginia
    branch: homologacao-auth-render-2026-11-16
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
