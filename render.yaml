databases:
  - name: elo360-database
    databaseName: elo360_db
    user: elo360_app
    region: virginia
    postgresMajorVersion: "18"
    plan: basic-256mb
    ipAllowList: []

services:
  - type: web
    name: elos360-global
    runtime: node
    region: virginia
    plan: starter
    branch: producao-elos360
    buildCommand: cd producao && npm install --omit=dev
    startCommand: cd producao && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: elo360-database
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: OWNER_EMAILS
        sync: false
