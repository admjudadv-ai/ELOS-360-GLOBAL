        options: >-
          --health-cmd="pg_isready -U elo_ci -d elo360_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CI_ELO_DB: ephemeral
      DATABASE_URL: postgresql://elo_ci:ficticia_apenas_ci@127.0.0.1:5432/elo360_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias do banco de testes
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Testar isolamento real por organizacao (RLS)
        working-directory: backend
        run: node --test test/rls.test.js
  tenant-relationships-postgres:
    runs-on: ubuntu-latest
    services:
