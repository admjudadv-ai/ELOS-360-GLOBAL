name: Aplicativos iOS e Android
on:
  push:
    branches: [producao-elos360]
    paths: ['apps/**', '.github/workflows/apps.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Compilar
        working-directory: apps/android
        run: |
          mkdir -p ../../out
          (gradle --no-daemon bundleRelease assembleDebug 2>&1; echo "exit=$?") | tee ../../out/android-build.log
          cp app/build/outputs/bundle/release/app-release.aab ../../out/elos360-android-release-unsigned.aab || true
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/elos360-android-teste.apk || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android, path: out/ }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (simulador, sem assinatura)
        working-directory: apps/ios
        run: |
          mkdir -p ../../out
          brew install xcodegen >/dev/null
          xcodegen generate
          (xcodebuild -project Elos360.xcodeproj -scheme Elos360 -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -80; echo "exit=${PIPESTATUS[0]}") | tee ../../out/ios-build.log
          cd build/Build/Products/Release-iphonesimulator && zip -qr ../../../../../../out/elos360-ios-simulador.zip Elos360.app || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios, path: out/ }
  publicar:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Gravar resultados no ramo apps-build
        run: |
          cd out && git init -q && git checkout -q -b apps-build
          echo "android=${{ needs.android.result }} ios=${{ needs.ios.result }} commit=${{ github.sha }} data=$(date -u +%FT%TZ)" > RESULTADO.txt
          git add -A && git -c user.name="Elos 360 Global" -c user.email="contato@elos360global.com.br" commit -qm "Resultado da compilação ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apps-build
